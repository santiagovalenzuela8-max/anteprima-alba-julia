name: Controllo del sito pubblicato (temporaneo)
on:
  push:
    branches: [tmp-menu-foto]
    paths: [check/shoot.mjs]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd check && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
          node shoot.mjs
      - if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add check/shots && git commit -qm "Screenshot del sito pubblicato" && git push origin HEAD:tmp-menu-foto
