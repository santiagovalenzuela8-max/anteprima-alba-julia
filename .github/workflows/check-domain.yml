name: Controllo dominio albaiulia.it
on:
  push:
    branches: [claude/alba-julia-restaurant-site-ytj4qr]
    paths: [.github/workflows/check-domain.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Risposta di albaiulia.it
        run: |
          echo "== intestazioni /"; curl -sS -D - -o body.html https://albaiulia.it/ | grep -iE "^HTTP|x-vercel|x-matched|server|content-type|location|strict" || true
          echo "== inizio corpo"; head -c 600 body.html; echo
          echo "== titolo"; grep -o "<title>[^<]*</title>" body.html || true
          echo "== asset diretto"; curl -sS -o /dev/null -w "%{http_code}\n" https://albaiulia.it/anteprima-albajulia3D/index.html || true
          echo "== stessa pagina su andiamonline.eu"; curl -sS -o /dev/null -w "%{http_code}\n" https://andiamonline.eu/anteprima-albajulia3D || true
          echo "== home andiamonline via albaiulia /portfolio"; curl -sS -o /dev/null -w "%{http_code}\n" https://albaiulia.it/portfolio || true
# run 2
